[project]
name = "brasaland-api"
version = "0.2.0"
description = "Brasaland Central API"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "tinydb>=4.8.0",
  "email-validator>=2.0.0",
  "python-jose[cryptography]>=3.5.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",
  "resend>=2.45.0",
  "python-dotenv>=1.2.1",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "routes"]
py-modules = ["seed", "database", "models", "main", "security"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=security",
  "--cov=routes.auth",
  "--cov=routes.users",
  "--cov=routes.profiles",
  "--cov-report=term-missing",
  "--cov-fail-under=70",
]

[tool.coverage.run]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true
