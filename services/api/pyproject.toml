[project]
name = "brasaland-api"
version = "0.2.0"
description = "Brasaland Central API"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "tinydb>=4.8.0",
  "email-validator>=2.0.0",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "routes"]
py-modules = ["seed", "database", "models", "main"]
