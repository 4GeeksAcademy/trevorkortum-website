<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brasaland · Supplier Directory</title>
    <meta name="description" content="Supplier directory for Brasaland procurement across Colombia and Florida." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23bd3f22'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='34' font-family='Segoe UI' fill='white'%3EB%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="suppliers-app">
    <aside class="sidebar" aria-label="Application navigation">
      <div class="brand-lockup">
        <span class="brand-icon">B</span>
        <div>
          <strong>Brasaland</strong>
          <span>Procurement</span>
        </div>
      </div>
      <nav>
        <a class="active" href="./index.html">Supplier Directory</a>
      </nav>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">Lucia Fernandez · Procurement</p>
          <h1>Supplier directory</h1>
        </div>
        <button type="button" id="btn-refresh-suppliers">Refresh</button>
      </header>

      <section class="panel" id="suppliers" aria-labelledby="suppliers-title">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Single source of truth</p>
            <h2 id="suppliers-title">Colombia and Florida suppliers</h2>
          </div>
        </div>

        <div class="supplier-toolbar">
          <label>
            Country
            <select id="filter-supplier-country">
              <option value="">All</option>
              <option value="Colombia">Colombia</option>
              <option value="USA">USA</option>
            </select>
          </label>
          <label>
            Category
            <select id="filter-supplier-category">
              <option value="">All</option>
              <option value="carne">carne</option>
              <option value="verduras_y_hortalizas">verduras_y_hortalizas</option>
              <option value="salsas_y_condimentos">salsas_y_condimentos</option>
              <option value="bebidas">bebidas</option>
              <option value="packaging">packaging</option>
              <option value="productos_limpieza">productos_limpieza</option>
              <option value="lacteos">lacteos</option>
              <option value="carbon_y_combustible">carbon_y_combustible</option>
            </select>
          </label>
          <p class="supplier-feedback" id="supplier-list-feedback" role="status" aria-live="polite"></p>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Country</th>
                <th>Categories</th>
                <th>Rate</th>
                <th>Currency</th>
                <th>Updated at</th>
                <th>Status</th>
                <th>Contact email</th>
                <th>Notes</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="suppliers-table-body"></tbody>
          </table>
        </div>

        <div class="supplier-form-wrap">
          <h3>Register supplier</h3>
          <form id="supplier-create-form" class="supplier-form" novalidate>
            <label>Name <input id="supplier-name" name="name" required /></label>
            <label>Country
              <select id="supplier-country" name="country" required>
                <option value="Colombia">Colombia</option>
                <option value="USA">USA</option>
              </select>
            </label>
            <label>Currency
              <select id="supplier-currency" name="currency" required>
                <option value="COP">COP</option>
                <option value="USD">USD</option>
              </select>
            </label>
            <label>Rate per unit <input id="supplier-rate" name="rate_per_unit" type="number" step="any" min="0.01" required /></label>
            <label>Status
              <select id="supplier-status" name="status">
                <option value="active">active</option>
                <option value="suspended">suspended</option>
              </select>
            </label>
            <label>Contact email <input id="supplier-email" name="contact_email" type="email" /></label>
            <fieldset class="category-fieldset">
              <legend>Categories</legend>
              <label><input type="checkbox" name="categories" value="carne" /> carne</label>
              <label><input type="checkbox" name="categories" value="verduras_y_hortalizas" /> verduras_y_hortalizas</label>
              <label><input type="checkbox" name="categories" value="salsas_y_condimentos" /> salsas_y_condimentos</label>
              <label><input type="checkbox" name="categories" value="bebidas" /> bebidas</label>
              <label><input type="checkbox" name="categories" value="packaging" /> packaging</label>
              <label><input type="checkbox" name="categories" value="productos_limpieza" /> productos_limpieza</label>
              <label><input type="checkbox" name="categories" value="lacteos" /> lacteos</label>
              <label><input type="checkbox" name="categories" value="carbon_y_combustible" /> carbon_y_combustible</label>
            </fieldset>
            <label class="full-width">Notes <textarea id="supplier-notes" name="notes" rows="2"></textarea></label>
            <div class="form-actions full-width">
              <button type="submit">Create supplier</button>
              <p class="supplier-feedback" id="supplier-form-feedback" role="status" aria-live="polite"></p>
            </div>
          </form>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
